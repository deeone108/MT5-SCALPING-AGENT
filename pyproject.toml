[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-scalping-agent"
version = "0.1.0"
description = "Safety-first research and backtesting foundation for an MT5 trading system."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "MetaTrader5>=5.0.45",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pydantic>=2.5,<3",
    "python-dotenv>=1.0,<2",
    "dukascopy-python==4.0.1",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

